site_name: IS 640 Business Application Programming
# Used for canonical URLs and the sitemap, and matches the GitHub Pages path.
site_url: https://on3moy.github.io/Python-for-Business-Apps/
repo_url: https://github.com/on3moy/Python-for-Business-Apps
repo_name: 'GitHub'

# https://www.mkdocs.org/user-guide/choosing-your-theme/
theme:
  icon:
     annotation: material/arrow-right-circle
  name: material
  custom_dir: overrides
  favicon: img/pythonlogo.gif
  logo: img/Brackets.ico
  # Dark Theme
  palette:
  - scheme: slate
    primary: 'black'
    accent: 'light blue'
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
  # Light Theme
  - scheme: default
    primary: 'white'
    accent: 'teal'
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  font:
    text: 'calibri'
    code: 'Consolas'
  shortcuts:
    help: 191    # ?
    next: 78     # n
    previous: 80 # p
    search: 83   # s
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.preview
    - navigation.path
    # Makes each chapter's index.md the clickable landing page for its section
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.annotate
    - content.code.copy
    - content.tooltips


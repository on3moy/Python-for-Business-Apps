# Marp decks are built into docs/assets/slides/ and linked explicitly.
not_in_nav: |
  assets/slides/*
  notebooks/SomeSmartName.py

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  # Table of Contents Stay
  - toc:
      permalink: "⬅️"
  # Ability to add notes in MD like !!! Some notes
  - admonition
  - pymdownx.superfences
  # Highlights code like functions, etc.
  - codehilite
  - attr_list
  # Highlights additional features
  - pymdownx.highlight:
      # Add clickable code blocks
      anchor_linenums: true
      # Notes use bare, untagged code fences (house style) — every one is
      # Python, so lex as Python instead of leaving fences unhighlighted.
      # (guess_lang is unreliable on short snippets: it mis-detected
      # `print('x', end=' ')` as SCSS.)
      default_lang: python
  # Allows inline code highlights
  - pymdownx.inlinehilite
  # Adds expanded notes, hidden content
  - pymdownx.details
  # Add nice interface for tasks format
  - pymdownx.tasklist
  # HTML links become clickable
  - pymdownx.magiclink
  # Adds strike through
  - pymdownx.tilde
  - pymdownx.tabbed

plugins:
  - search
  - mkdocs-jupyter:
      include_source: true

